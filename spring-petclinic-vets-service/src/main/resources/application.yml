spring:
  application:
    name: vets-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}
  cache:
    cache-names: vets
    # Pinned: with the Redis starter on the classpath Spring would otherwise pick Redis
    type: caffeine
  profiles:
    active: production
management:
  health:
    redis:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: docker
    import: configserver:http://config-server:8888

---
# SAP BTP Cloud Foundry: PostgreSQL from the bound "petclinic-db" service instance,
# "vets" cache in the bound "petclinic-redis" service instance,
# no Config Server, Eureka or Zipkin. Activated by SPRING_PROFILES_ACTIVE in manifest.yml.
spring:
  config:
    activate:
      on-profile: cf
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:postgresql://${vcap.services.petclinic-db.credentials.hostname}:${vcap.services.petclinic-db.credentials.port}/${vcap.services.petclinic-db.credentials.dbname}?sslmode=require
    username: ${vcap.services.petclinic-db.credentials.username}
    password: ${vcap.services.petclinic-db.credentials.password}
  sql:
    init:
      mode: always
      schema-locations: classpath*:db/postgresql/schema.sql
      data-locations: classpath*:db/postgresql/data.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  cache:
    type: redis
    redis:
      time-to-live: 60s
  data:
    redis:
      host: ${vcap.services.petclinic-redis.credentials.hostname}
      port: ${vcap.services.petclinic-redis.credentials.port}
      password: ${vcap.services.petclinic-redis.credentials.password}
      ssl:
        enabled: true
server:
  port: ${PORT:8080}
eureka:
  client:
    enabled: false
management:
  health:
    redis:
      enabled: true
  tracing:
    sampling:
      probability: 0.0

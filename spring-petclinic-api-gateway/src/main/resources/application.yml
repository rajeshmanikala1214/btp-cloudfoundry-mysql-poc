spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: CircuitBreaker
              args:
                name: defaultCircuitBreaker
                fallbackUri: forward:/fallback
            - name: Retry
              args:
                retries: 1
                statuses: SERVICE_UNAVAILABLE
                methods: POST
          routes:
            - id: vets-service
              uri: lb://vets-service
              predicates:
                - Path=/api/vet/**
              filters:
                - StripPrefix=2
            - id: visits-service
              uri: lb://visits-service
              predicates:
                - Path=/api/visit/**
              filters:
                - StripPrefix=2
            - id: customers-service
              uri: lb://customers-service
              predicates:
                - Path=/api/customer/**
              filters:
                - StripPrefix=2
            - id: genai-service
              uri: lb://genai-service
              predicates:
                - Path=/api/genai/**
              filters:
                - StripPrefix=2
                - CircuitBreaker=name=genaiCircuitBreaker,fallbackUri=/fallback
  reactor:
    context-propagation: auto
---
spring:
  config:
    activate:
      on-profile: docker
    import: configserver:http://config-server:8888

---
# SAP BTP Cloud Foundry: no Eureka or Config Server. The gateway's lb:// routes and
# load-balanced WebClient calls are resolved by Spring Cloud's simple discovery client
# from the deployed apps' URLs, which manifest.yml passes in as environment variables.
# genai-service is not deployed, so the chat box answers with the fallback message.
spring:
  config:
    activate:
      on-profile: cf
  cloud:
    config:
      enabled: false
    discovery:
      client:
        simple:
          instances:
            customers-service:
              - uri: ${CUSTOMERS_SERVICE_URL}
            vets-service:
              - uri: ${VETS_SERVICE_URL}
            visits-service:
              - uri: ${VISITS_SERVICE_URL}
server:
  port: ${PORT:8080}
eureka:
  client:
    enabled: false
management:
  tracing:
    sampling:
      probability: 0.0
